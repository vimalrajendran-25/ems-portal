services:
  - type: web
    name: ems-backend
    env: java
    region: oregon
    plan: free
    buildCommand: ./mvnw clean package -DskipTests
    startCommand: java -jar target/*.jar
    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: prod
      - key: DATABASE_URL
        fromDatabase:
          name: ems-db
          property: connectionString
      - key: DATABASE_USER
        fromDatabase:
          name: ems-db
          property: user
      - key: DATABASE_PASS
        fromDatabase:
          name: ems-db
          property: password
      - key: JAVA_OPTS
        value: -Xmx256m

  - type: web
    name: ems-frontend
    env: static
    region: oregon
    plan: free
    buildCommand: cd frontend && npm install && npm run build
    staticPublishPath: frontend/dist
    envVars:
      - key: VITE_API_URL
        value: https://ems-backend.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html

databases:
  - name: ems-db
    plan: free
    region: oregon
    databaseName: emsdb
    ipAllowList: []
